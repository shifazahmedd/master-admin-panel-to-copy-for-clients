<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softode Admin Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], }, colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } } } }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden antialiased">

    <!-- LOGIN SCREEN -->
    <div id="auth-view" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md relative z-10 border border-slate-100">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-lg text-white">
                    <i class="ph-bold ph-lightning text-3xl"></i>
                </div>
            </div>
            <h1 class="text-3xl font-extrabold text-center text-slate-900">Softode Admin</h1>
            <p class="text-center text-slate-500 mt-2 mb-8 text-sm font-medium">Cloud Database Connected</p>
            
            <div class="space-y-5">
                <button type="button" onclick="connectSupabase()" id="login-btn" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="ph-bold ph-database"></i> Connect to Supabase
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-layout" class="hidden w-full h-full flex-col md:flex-row relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 flex flex-col md:relative md:flex-shrink-0 shadow-2xl md:shadow-none">
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md font-bold text-xl">S</div>
                <div><h2 class="text-slate-900 font-extrabold text-lg leading-tight">Softode</h2><p class="text-[10px] font-black text-brand-600 uppercase tracking-widest">Admin Panel</p></div>
            </div>
            
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 bg-brand-50 text-brand-700 rounded-xl font-bold"><i class="ph-bold ph-squares-four text-xl"></i> Dashboard</button>
                <button onclick="switchTab('transactions')" id="nav-transactions" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-semibold"><i class="ph-bold ph-receipt text-xl"></i> Live Orders</button>
                <button onclick="switchTab('catalog')" id="nav-catalog" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-semibold"><i class="ph-bold ph-storefront text-xl"></i> Catalog Manager</button>
            </nav>
            <div class="p-4 border-t border-slate-100"><button onclick="location.reload()" class="w-full py-2.5 text-sm text-red-600 font-bold hover:bg-red-50 rounded-lg">Disconnect</button></div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto relative bg-slate-50/50">
            <div class="p-4 md:p-8 w-full max-w-7xl mx-auto pb-24">
                
                <!-- DASHBOARD -->
                <div id="view-dashboard" class="block animate-fade-in">
                    <div class="mb-8"><h2 class="text-3xl font-extrabold text-slate-900">Dashboard</h2></div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="glass-card p-6 rounded-3xl shadow-sm border-l-4 border-brand-500"><p class="text-sm font-bold text-slate-500 uppercase">Total Revenue</p><p class="text-3xl font-black text-slate-900" id="stat-revenue">$0</p></div>
                        <div class="glass-card p-6 rounded-3xl shadow-sm border-l-4 border-amber-500"><p class="text-sm font-bold text-slate-500 uppercase">Sites Pending Setup</p><p class="text-3xl font-black text-amber-600" id="stat-pending">0</p></div>
                        <div class="glass-card p-6 rounded-3xl shadow-sm border-l-4 border-emerald-500"><p class="text-sm font-bold text-slate-500 uppercase">Active Catalog Items</p><p class="text-3xl font-black text-emerald-600" id="stat-items">0</p></div>
                    </div>
                </div>

                <!-- ORDERS -->
                <div id="view-transactions" class="hidden animate-fade-in">
                    <div class="mb-8">
                        <h2 class="text-3xl font-extrabold text-slate-900">Live Orders & Client Setup</h2>
                    </div>
                    <div class="glass-card rounded-3xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50/80">
                                <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase font-bold">
                                    <th class="p-5">Order ID</th>
                                    <th class="p-5">Client Contact</th>
                                    <th class="p-5">Product Details</th>
                                    <th class="p-5">Total Paid</th>
                                    <th class="p-5">Status</th>
                                    <th class="p-5 text-right">Delete</th>
                                </tr>
                            </thead>
                            <tbody id="tx-list" class="divide-y divide-slate-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <!-- CATALOG -->
                <div id="view-catalog" class="hidden animate-fade-in">
                    <div class="mb-8 flex justify-between items-end gap-4">
                        <div>
                            <h2 class="text-3xl font-extrabold text-slate-900">Catalog Manager</h2>
                        </div>
                        <button onclick="openCatalogModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center gap-2">
                            <i class="ph-bold ph-plus"></i> Add Product
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="catalog-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- CATALOG MODAL -->
    <div id="modal-catalog" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-6 overflow-y-auto max-h-[90vh]">
            <h3 id="modal-catalog-title" class="text-xl font-extrabold text-slate-900 mb-4">Add Template to Store</h3>
            <form id="catalog-form" class="space-y-4">
                <input type="hidden" id="cat-id">
                
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">Product/Template Name</label>
                    <input type="text" id="cat-name" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-brand-500">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-1">Price ($)</label>
                        <input type="number" id="cat-price" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-1">Category</label>
                        <input type="text" id="cat-category" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-brand-500">
                    </div>
                </div>
                
                <div>
                    <label class="text-xs font-bold text-brand-600 block mb-1">Live Demo URL</label>
                    <input type="text" id="cat-demo" class="w-full p-3 bg-brand-50 border border-brand-100 rounded-xl outline-none focus:border-brand-500">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">Main Cover Image URL</label>
                    <input type="text" id="cat-image" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-brand-500">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">Short Description</label>
                    <textarea id="cat-desc" rows="2" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-brand-500"></textarea>
                </div>
                
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="closeCatalogModal()" class="px-6 py-3 bg-slate-100 rounded-xl font-bold">Cancel</button>
                    <button type="submit" class="px-6 py-3 bg-brand-600 text-white rounded-xl font-bold shadow-md">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SUPABASE LOGIC -->
    <script>
        const SUPABASE_URL = 'https://vzznqlxiolikyrzabgbb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6em5xbHhpb2xpa3lyemFiZ2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTE4NzEsImV4cCI6MjEwMjM2Nzg3MX0.0K7l5yzpDC9m-MwzANH3xEWu5JBg_PELHAl99Po1EwY';
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        let db = { catalog: [], transactions: [] };

        function switchTab(tabId) {
            ['dashboard', 'transactions', 'catalog'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('nav-' + id).className = 'w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold transition';
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            let iconClass = tabId === 'dashboard' ? 'ph-squares-four' : tabId === 'transactions' ? 'ph-receipt' : 'ph-storefront';
            document.getElementById('nav-' + tabId).className = `w-full flex items-center gap-3 px-4 py-3 bg-brand-50 text-brand-700 rounded-xl font-bold transition`;
        }

        async function connectSupabase() {
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> Connecting...';
            
            try {
                await fetchAllData();
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('app-layout').classList.remove('hidden');
                document.getElementById('app-layout').classList.add('flex');
                switchTab('dashboard');
            } catch (error) {
                btn.innerHTML = '<i class="ph-bold ph-database"></i> Connect to Supabase';
            }
        }

        async function fetchAllData() {
            try {
                // Fetch Catalog
                const catRes = await fetch(`${SUPABASE_URL}/rest/v1/catalog?select=*&order=sort_order.asc`, { headers });
                if (!catRes.ok) throw new Error(`Catalog Error: ${await catRes.text()}`);
                db.catalog = await catRes.json();

                // Fetch Transactions
                const txRes = await fetch(`${SUPABASE_URL}/rest/v1/transactions?select=*`, { headers });
                if (!txRes.ok) throw new Error(`Transaction Error: ${await txRes.text()}`);
                db.transactions = await txRes.json();
                
                refreshUI();
            } catch (e) { 
                alert("DATABASE CONNECTION FAILED: \n\n" + e.message); 
                throw e; 
            }
        }

        function refreshUI() {
            let rev = 0, pend = 0;
            db.transactions.forEach(t => { 
                if(t.status === 'Deployed / Completed' || t.status === 'completed') rev += parseFloat(t.total || t.amount || 0); 
                if(t.status === 'Pending Setup' || t.status === 'Pending') pend++; 
            });
            document.getElementById('stat-revenue').textContent = "$" + rev.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('stat-pending').textContent = pend;
            document.getElementById('stat-items').textContent = db.catalog.length;

            const cGrid = document.getElementById('catalog-grid'); cGrid.innerHTML = '';
            db.catalog.forEach((c, index) => {
                cGrid.innerHTML += `
                    <div class="glass-card rounded-3xl p-6 relative flex flex-col h-full border border-slate-200 shadow-sm">
                        <div class="absolute top-4 right-4 flex gap-2">
                            <button onclick='openEditModal(${c.id})' class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-brand-100 transition"><i class="ph-bold ph-pencil-simple"></i></button>
                            <button onclick='deleteCatalog(${c.id})' class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-red-100 transition"><i class="ph-bold ph-trash"></i></button>
                        </div>
                        <span class="text-[10px] font-black uppercase text-brand-600 bg-brand-50 px-2 py-1 rounded-md self-start mb-3">${c.category || 'Template'}</span>
                        <h3 class="text-lg font-bold text-slate-900 pr-16 leading-tight">${c.name}</h3>
                        <p class="text-2xl font-black text-slate-900 mt-1 mb-4">$${c.price}</p>
                        <div class="h-32 w-full rounded-xl overflow-hidden bg-slate-100 mb-4"><img src="${c.image}" class="w-full h-full object-cover"></div>
                        <p class="text-xs font-mono text-slate-500 bg-slate-50 border p-2 rounded-lg truncate mt-auto">Demo: ${c.supplier || 'None'}</p>
                    </div>`;
            });

            const tList = document.getElementById('tx-list'); tList.innerHTML = '';
            if(db.transactions.length === 0) tList.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400">No orders yet.</td></tr>';
            db.transactions.sort((a,b)=>b.id-a.id).forEach(t => {
                const customerName = t.customer_name || (t.customer ? t.customer.name : 'Unknown');
                const customerEmail = t.customer_email || (t.customer ? t.customer.email : 'No Email');
                const productName = t.product_name || (t.items && t.items[0] ? 'Item ID: ' + t.items[0].catalogId : 'Unknown Product');
                
                tList.innerHTML += `
                    <tr class="border-b transition">
                        <td class="p-5 font-medium text-slate-500 text-xs">#${t.id || 'N/A'}</td>
                        <td class="p-5"><b>${customerName}</b><br><span class="text-xs text-slate-500">${customerEmail}</span></td>
                        <td class="p-5"><div class="bg-white border p-2 rounded-lg text-xs shadow-sm"><b>${productName}</b></div></td>
                        <td class="p-5 font-black text-slate-900">$${t.amount || t.total || 0}</td>
                        <td class="p-5">
                            <select onchange="updateOrderStatus(${t.id || t.transactionId}, this.value)" class="px-3 py-1.5 border rounded-lg text-xs font-bold outline-none">
                                <option value="Pending" ${t.status==='Pending Setup' || t.status==='Pending'?'selected':''}>Pending</option>
                                <option value="completed" ${(t.status==='Deployed / Completed' || t.status==='completed')?'selected':''}>Completed</option>
                            </select>
                        </td>
                        <td class="p-5 text-right"><button onclick="deleteOrder(${t.id})" class="text-xs text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded-lg">Delete</button></td>
                    </tr>`;
            });
        }

        function openCatalogModal() {
            document.getElementById('catalog-form').reset();
            document.getElementById('cat-id').value = '';
            document.getElementById('modal-catalog-title').innerText = "Add New Product";
            document.getElementById('modal-catalog').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = db.catalog.find(c => c.id === id);
            if(!item) return;
            document.getElementById('cat-id').value = item.id;
            document.getElementById('cat-name').value = item.name;
            document.getElementById('cat-price').value = item.price;
            document.getElementById('cat-category').value = item.category || 'Templates';
            document.getElementById('cat-demo').value = item.supplier || '';
            document.getElementById('cat-image').value = item.image || '';
            document.getElementById('cat-desc').value = item.description || '';
            
            document.getElementById('modal-catalog-title').innerText = "Edit Product";
            document.getElementById('modal-catalog').classList.remove('hidden');
        }

        function closeCatalogModal() {
            document.getElementById('modal-catalog').classList.add('hidden');
        }

        document.getElementById('catalog-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.submitter;
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> Saving...';

            const catId = document.getElementById('cat-id').value;

            // Notice: Image Gallery and Full Description are removed from this payload so it doesn't crash your DB!
            const itemData = {
                name: document.getElementById('cat-name').value,
                price: parseFloat(document.getElementById('cat-price').value),
                category: document.getElementById('cat-category').value,
                image: document.getElementById('cat-image').value,
                description: document.getElementById('cat-desc').value,
                supplier: document.getElementById('cat-demo').value, 
                type: 'Website'
            };
            
            try {
                let response;
                if (catId) {
                    response = await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${catId}`, { method: 'PATCH', headers, body: JSON.stringify(itemData) });
                } else {
                    itemData.id = Date.now();
                    itemData.sort_order = db.catalog.length;
                    response = await fetch(`${SUPABASE_URL}/rest/v1/catalog`, { method: 'POST', headers, body: JSON.stringify(itemData) });
                }
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }

                closeCatalogModal();
                await fetchAllData();
                alert("Product saved successfully!");
            } catch (err) { 
                alert("FAILED TO SAVE PRODUCT! \n\nReason from Supabase: \n" + err.message); 
            } finally { 
                btn.innerText = originalText; 
            }
        });

        async function deleteCatalog(id) {
            if(confirm("Remove this item from your storefront?")) {
                await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${id}`, { method: 'DELETE', headers });
                fetchAllData();
            }
        }

        async function updateOrderStatus(id, newStatus) {
            await fetch(`${SUPABASE_URL}/rest/v1/transactions?id=eq.${id}`, { method: 'PATCH', headers, body: JSON.stringify({ status: newStatus }) });
            fetchAllData();
        }

        async function deleteOrder(id) {
            if(confirm("Delete this order record permanently?")) {
                await fetch(`${SUPABASE_URL}/rest/v1/transactions?id=eq.${id}`, { method: 'DELETE', headers });
                fetchAllData();
            }
        }
    </script>
</body>
</html>
