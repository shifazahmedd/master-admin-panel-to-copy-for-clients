<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDash Pro - Cloud Database</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], }, colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } } } }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden antialiased">

    <!-- LOGIN SCREEN -->
    <div id="auth-view" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md relative z-10 border border-slate-100">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-lg text-white">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
            </div>
            <h1 class="text-3xl font-extrabold text-center text-slate-900">OmniDash Pro</h1>
            <p class="text-center text-slate-500 mt-2 mb-8 text-sm">Supabase Cloud Edition</p>
            
            <form id="login-form" class="space-y-5">
                <div><input type="email" required placeholder="admin@business.com" class="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-medium"></div>
                <div><input type="password" required placeholder="••••••••" class="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-medium"></div>
                <button type="submit" id="login-btn" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl transition">Connect to Cloud Database</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-layout" class="hidden w-full h-full flex-col md:flex-row relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 flex flex-col md:relative md:flex-shrink-0 shadow-2xl md:shadow-none">
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                </div>
                <div><h2 class="text-slate-900 font-extrabold text-lg">OmniDash</h2><p class="text-[10px] font-black text-brand-600 uppercase">Cloud Linked</p></div>
            </div>
            
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 bg-brand-50 text-brand-700 rounded-xl font-bold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</button>
                <button onclick="switchTab('transactions')" id="nav-transactions" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-semibold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> Orders</button>
                <button onclick="switchTab('catalog')" id="nav-catalog" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-semibold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path></svg> Catalog</button>
            </nav>
            <div class="p-4 border-t"><button onclick="location.reload()" class="w-full py-2.5 text-sm text-red-600 font-bold">Sign Out</button></div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto relative bg-slate-50/50">
            <div class="p-4 md:p-8 w-full max-w-7xl mx-auto pb-24">
                
                <!-- DASHBOARD -->
                <div id="view-dashboard" class="block animate-fade-in">
                    <div class="mb-8"><h2 class="text-3xl font-extrabold text-slate-900">Dashboard</h2></div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="glass-card p-6 rounded-3xl shadow-sm border-l-4 border-brand-500"><p class="text-sm font-bold text-slate-500">Total Revenue</p><p class="text-3xl font-black" id="stat-revenue">$0</p></div>
                        <div class="glass-card p-6 rounded-3xl shadow-sm border-l-4 border-amber-500"><p class="text-sm font-bold text-slate-500">Pending Orders</p><p class="text-3xl font-black text-amber-600" id="stat-pending">0</p></div>
                        <div class="glass-card p-6 rounded-3xl shadow-sm border-l-4 border-emerald-500"><p class="text-sm font-bold text-slate-500">Total Catalog Items</p><p class="text-3xl font-black text-emerald-600" id="stat-items">0</p></div>
                    </div>
                </div>

                <!-- ORDERS -->
                <div id="view-transactions" class="hidden animate-fade-in">
                    <div class="mb-8"><h2 class="text-3xl font-extrabold text-slate-900">Live Orders</h2></div>
                    <div class="glass-card rounded-3xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50/80">
                                <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase font-bold">
                                    <th class="p-5">Order ID</th><th class="p-5">Customer Info</th><th class="p-5">Order Value</th><th class="p-5">Status</th><th class="p-5 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tx-list" class="divide-y divide-slate-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <!-- CATALOG -->
                <div id="view-catalog" class="hidden animate-fade-in">
                    <div class="mb-8 flex justify-between items-end gap-4">
                        <h2 class="text-3xl font-extrabold text-slate-900">Cloud Catalog</h2>
                        <button onclick="document.getElementById('modal-catalog').classList.remove('hidden')" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg">Add New Item</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="catalog-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- CATALOG MODAL -->
    <div id="modal-catalog" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 overflow-y-auto">
            <h3 class="text-xl font-extrabold text-slate-900 mb-4">Add Item to Supabase</h3>
            <form id="catalog-form" class="space-y-4">
                <div><label class="text-xs font-bold text-slate-500 block mb-1">Name</label><input type="text" id="cat-name" required class="w-full p-3 bg-slate-50 border rounded-xl"></div>
                <div><label class="text-xs font-bold text-slate-500 block mb-1">Price</label><input type="number" id="cat-price" required class="w-full p-3 bg-slate-50 border rounded-xl"></div>
                <div><label class="text-xs font-bold text-slate-500 block mb-1">Image URL</label><input type="text" id="cat-image" class="w-full p-3 bg-slate-50 border rounded-xl"></div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="document.getElementById('modal-catalog').classList.add('hidden')" class="px-6 py-3 bg-slate-100 rounded-xl font-bold">Cancel</button>
                    <button type="submit" class="px-6 py-3 bg-brand-600 text-white rounded-xl font-bold">Save to Cloud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SUPABASE JAVASCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://vzznqlxiolikyrzabgbb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1zHkc8FfhIZs41L3xuNMNQ_l9L6Ph8G';
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        // Global State
        let db = { catalog: [], transactions: [] };

        // Navigation
        function switchTab(tabId) {
            ['dashboard', 'transactions', 'catalog'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('nav-' + id).className = 'w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold';
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('nav-' + tabId).className = 'w-full flex items-center gap-3 px-4 py-3 bg-brand-50 text-brand-700 rounded-xl font-bold';
        }

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerText = "Syncing with Supabase...";
            
            await fetchAllData();
            
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            document.getElementById('app-layout').classList.add('flex');
            switchTab('dashboard');
        });

        // Data Fetching
        async function fetchAllData() {
            try {
                const catRes = await fetch(`${SUPABASE_URL}/rest/v1/catalog?select=*`, { headers });
                db.catalog = await catRes.json();
                
                const txRes = await fetch(`${SUPABASE_URL}/rest/v1/transactions?select=*`, { headers });
                db.transactions = await txRes.json();
                
                refreshUI();
            } catch (e) { alert("Failed to connect to Supabase database"); }
        }

        function refreshUI() {
            // Dashboard
            let rev = 0, pend = 0;
            db.transactions.forEach(t => { 
                if(t.status === 'Completed') rev += t.total; 
                if(t.status === 'Pending') pend++; 
            });
            document.getElementById('stat-revenue').textContent = "$" + rev.toLocaleString();
            document.getElementById('stat-pending').textContent = pend;
            document.getElementById('stat-items').textContent = db.catalog.length;

            // Catalog
            const cGrid = document.getElementById('catalog-grid'); cGrid.innerHTML = '';
            db.catalog.forEach(c => {
                cGrid.innerHTML += `
                    <div class="glass-card rounded-3xl p-6 relative">
                        <button onclick='deleteCatalog(${c.id})' class="absolute top-4 right-4 text-red-500 font-bold">✕</button>
                        <h3 class="text-xl font-bold mt-2">${c.name}</h3>
                        <p class="text-xl font-black text-brand-600">$${c.price}</p>
                    </div>`;
            });

            // Transactions
            const tList = document.getElementById('tx-list'); tList.innerHTML = '';
            db.transactions.sort((a,b)=>b.id-a.id).forEach(t => {
                tList.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b">
                        <td class="p-5 font-medium text-slate-500">#${t.id}</td>
                        <td class="p-5"><b>${t.customer.name}</b><br><span class="text-xs text-slate-500">${t.customer.email}</span></td>
                        <td class="p-5 font-bold text-brand-600">$${t.total}</td>
                        <td class="p-5"><select onchange="updateOrderStatus(${t.id}, this.value)" class="px-2 py-1 border rounded bg-white text-xs font-bold"><option ${t.status==='Pending'?'selected':''}>Pending</option><option ${t.status==='Completed'?'selected':''}>Completed</option></select></td>
                        <td class="p-5 text-right"><button onclick="deleteOrder(${t.id})" class="text-xs text-red-500 font-bold">Delete</button></td>
                    </tr>`;
            });
        }

        // Database Mutations
        document.getElementById('catalog-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('cat-name').value,
                price: parseFloat(document.getElementById('cat-price').value),
                image: document.getElementById('cat-image').value,
                type: 'Product', stock: null
            };
            
            await fetch(`${SUPABASE_URL}/rest/v1/catalog`, { method: 'POST', headers, body: JSON.stringify(newItem) });
            document.getElementById('modal-catalog').classList.add('hidden');
            fetchAllData(); // Refresh table
        });

        async function deleteCatalog(id) {
            if(confirm("Delete this product?")) {
                await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${id}`, { method: 'DELETE', headers });
                fetchAllData();
            }
        }

        async function updateOrderStatus(id, newStatus) {
            await fetch(`${SUPABASE_URL}/rest/v1/transactions?id=eq.${id}`, { method: 'PATCH', headers, body: JSON.stringify({ status: newStatus }) });
            fetchAllData();
        }

        async function deleteOrder(id) {
            if(confirm("Delete this order?")) {
                await fetch(`${SUPABASE_URL}/rest/v1/transactions?id=eq.${id}`, { method: 'DELETE', headers });
                fetchAllData();
            }
        }
    </script>
</body>
</html>
