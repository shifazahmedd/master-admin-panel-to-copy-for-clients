<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDash Pro | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="h-20 flex items-center px-6 border-b border-slate-800">
            <div class="flex items-center gap-2 font-bold text-xl tracking-tight">
                <i class="ph-fill ph-hexagon text-indigo-500 text-2xl"></i> OmniDash
            </div>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 bg-indigo-600 rounded-xl font-medium shadow-lg shadow-indigo-900/20"><i class="ph-bold ph-storefront text-lg"></i> Storefront</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-20 glass-panel border-b border-slate-200 flex items-center justify-between px-8 z-10">
            <h1 class="text-xl font-bold text-slate-800">Product Management</h1>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md flex items-center gap-2">
                <i class="ph-bold ph-plus"></i> Add New Product
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-semibold">
                            <th class="p-4 pl-6">Product</th>
                            <th class="p-4">Category</th>
                            <th class="p-4">Sort Order</th>
                            <th class="p-4">Price</th>
                            <th class="p-4 text-right pr-6">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400"><i class="ph ph-spinner animate-spin text-3xl mb-2"></i><br>Loading catalog...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="product-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
                <h2 id="modal-title" class="text-xl font-bold text-slate-800">Add New Product</h2>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 text-slate-500 transition-colors"><i class="ph-bold ph-x"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="product-form" class="space-y-5">
                    <input type="hidden" id="prod-id">
                    
                    <div class="grid grid-cols-2 gap-5">
                        <div class="space-y-1.5"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Product Name</label><input type="text" id="prod-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"></div>
                        <div class="space-y-1.5"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Category</label><input type="text" id="prod-category" placeholder="e.g. Template, Web App" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div class="space-y-1.5"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Price ($)</label><input type="number" id="prod-price" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all"></div>
                        <div class="space-y-1.5"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Live Demo Link (URL)</label><input type="url" id="prod-demo" placeholder="https://demo.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all"></div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-5">
                        <div class="space-y-1.5"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Main Cover Image URL</label><input type="url" id="prod-image" required placeholder="https://..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all"></div>
                        <div class="space-y-1.5"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Sort Order (Higher = First)</label><input type="number" id="prod-sort" placeholder="0" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all"></div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Short Description (For Homepage)</label>
                        <textarea id="prod-desc" rows="2" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all resize-none"></textarea>
                    </div>

                    <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl space-y-4">
                        <h3 class="text-sm font-bold text-indigo-900 flex items-center gap-2"><i class="ph-fill ph-star"></i> Dedicated Product Page Details</h3>
                        
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-indigo-700 uppercase tracking-wider">Media Gallery (Images & YouTube links!)</label>
                            <textarea id="prod-gallery" rows="2" placeholder="https://img1.jpg, https://youtube.com/watch?v=..." class="w-full px-4 py-2.5 bg-white border border-indigo-200 rounded-xl text-sm focus:border-indigo-500 outline-none transition-all resize-none"></textarea>
                            <p class="text-[10px] text-indigo-600 font-medium">Separate links with commas. YouTube links will automatically turn into playable videos!</p>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-indigo-700 uppercase tracking-wider">Full Detailed Features (Text)</label>
                            <textarea id="prod-full-desc" rows="4" placeholder="List all features, what's included, and FAQs here..." class="w-full px-4 py-2.5 bg-white border border-indigo-200 rounded-xl text-sm focus:border-indigo-500 outline-none transition-all resize-none"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-100 bg-slate-50 rounded-b-3xl flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-200 rounded-xl transition-all">Cancel</button>
                <button onclick="saveProduct()" id="save-btn" class="px-6 py-2.5 text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl shadow-md transition-all flex items-center gap-2">Save Product</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vzznqlxiolikyrzabgbb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1zHkc8FfhIZs41L3xuNMNQ_l9L6Ph8G';
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        let productsData = [];

        async function fetchProducts() {
            try {
                // Fetch ordered by the new sort_order column
                const res = await fetch(`${SUPABASE_URL}/rest/v1/catalog?select=*&order=sort_order.desc,id.desc`, { headers });
                productsData = await res.json();
                renderTable();
            } catch (err) {
                document.getElementById('product-table-body').innerHTML = `<tr><td colspan="5" class="text-center text-red-500 p-8 font-bold">Error loading database. Make sure you ran the SQL script!</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('product-table-body');
            tbody.innerHTML = '';
            if (!productsData || productsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500 font-medium">Your store is empty. Add a product!</td></tr>`;
                return;
            }
            productsData.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors border-b border-slate-50 last:border-0 group">
                        <td class="p-4 pl-6">
                            <div class="flex items-center gap-4">
                                <img src="${p.image || 'https://placehold.co/100'}" class="w-12 h-12 rounded-lg object-cover bg-slate-100 border border-slate-200">
                                <div><p class="font-bold text-slate-800">${p.name}</p></div>
                            </div>
                        </td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-md">${p.category || 'Template'}</span></td>
                        <td class="p-4 font-bold text-slate-500">${p.sort_order || 0}</td>
                        <td class="p-4 font-bold text-slate-800">$${p.price}</td>
                        <td class="p-4 pr-6 text-right space-x-2">
                            <button onclick="editProduct(${p.id})" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all"><i class="ph-bold ph-pencil-simple text-lg"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"><i class="ph-bold ph-trash text-lg"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function openModal() {
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('modal-title').innerText = 'Add New Product';
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function editProduct(id) {
            const p = productsData.find(x => x.id === id);
            if(!p) return;
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name || '';
            document.getElementById('prod-category').value = p.category || '';
            document.getElementById('prod-price').value = p.price || 0;
            document.getElementById('prod-image').value = p.image || '';
            document.getElementById('prod-desc').value = p.description || '';
            document.getElementById('prod-demo').value = p.supplier || '';
            document.getElementById('prod-gallery').value = p.image_gallery || '';
            document.getElementById('prod-full-desc').value = p.full_description || '';
            document.getElementById('prod-sort').value = p.sort_order || 0;
            
            document.getElementById('modal-title').innerText = 'Edit Product';
            document.getElementById('product-modal').classList.remove('hidden');
        }

        async function saveProduct() {
            const btn = document.getElementById('save-btn');
            btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Saving...';
            
            const id = document.getElementById('prod-id').value;
            
            const payload = {
                name: document.getElementById('prod-name').value,
                category: document.getElementById('prod-category').value,
                price: parseFloat(document.getElementById('prod-price').value),
                image: document.getElementById('prod-image').value,
                description: document.getElementById('prod-desc').value,
                supplier: document.getElementById('prod-demo').value,
                image_gallery: document.getElementById('prod-gallery').value,
                full_description: document.getElementById('prod-full-desc').value,
                sort_order: parseInt(document.getElementById('prod-sort').value) || 0
            };

            try {
                const method = id ? 'PATCH' : 'POST';
                const url = id ? `${SUPABASE_URL}/rest/v1/catalog?id=eq.${id}` : `${SUPABASE_URL}/rest/v1/catalog`;
                
                await fetch(url, { method, headers, body: JSON.stringify(payload) });
                closeModal();
                fetchProducts();
            } catch (err) { alert("Failed to save. Check internet connection."); }
            
            btn.innerHTML = 'Save Product';
        }

        async function deleteProduct(id) {
            if(confirm("Are you sure you want to delete this product?")) {
                await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${id}`, { method: 'DELETE', headers });
                fetchProducts();
            }
        }

        fetchProducts();
    </script>
</body>
</html>
